[workspace]
resolver = "2"
members = [
    "crates/dx-core",
    "crates/dx-manifest",
    "crates/dx-security",
    "crates/dx-integrity",
    "crates/dx-sandbox",
    "crates/dx-build",
    "crates/dx-release",
    "crates/dx-report",
    "crates/dx-seiva",
    "crates/dx-bench",
    "crates/dx-env",
    "crates/dx-tool",
    "crates/dx-toolchain",
    "crates/dx-script",
    "crates/dx-compat",
    "crates/dx-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ngolacloud/dx"
authors = ["Walter Angolar <angolarti@gmail.com>"]

# DX distingue o NOME PUBLICADO do NOME DO EXECUTÁVEL (ver docs/adr/0003).
# O crate `dx` já existe (e está yanked) em crates.io; o binário chama-se `dx`
# mas o package de publicação será `dx-cli` (ou outro nome a confirmar).

[workspace.dependencies]
dx-core = { package = "ngoladx-core", path = "crates/dx-core", version = "0.0.1" }
dx-manifest = { package = "ngoladx-manifest", path = "crates/dx-manifest", version = "0.0.1" }
dx-security = { package = "ngoladx-security", path = "crates/dx-security", version = "0.0.1" }
dx-integrity = { package = "ngoladx-integrity", path = "crates/dx-integrity", version = "0.0.1" }
dx-sandbox = { package = "ngoladx-sandbox", path = "crates/dx-sandbox", version = "0.0.1" }
dx-build = { package = "ngoladx-build", path = "crates/dx-build", version = "0.0.1" }
dx-release = { package = "ngoladx-release", path = "crates/dx-release", version = "0.0.1" }
dx-report = { package = "ngoladx-report", path = "crates/dx-report", version = "0.0.1" }
dx-seiva = { package = "ngoladx-seiva", path = "crates/dx-seiva", version = "0.0.1" }
dx-bench = { package = "ngoladx-bench", path = "crates/dx-bench", version = "0.0.1" }
dx-env = { package = "ngoladx-env", path = "crates/dx-env", version = "0.0.1" }
dx-tool = { package = "ngoladx-tool", path = "crates/dx-tool", version = "0.0.1" }
dx-toolchain = { package = "ngoladx-toolchain", path = "crates/dx-toolchain", version = "0.0.1" }
dx-script = { package = "ngoladx-script", path = "crates/dx-script", version = "0.0.1" }
dx-compat = { package = "ngoladx-compat", path = "crates/dx-compat", version = "0.0.1" }
sha2 = "0.10"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
camino = { version = "1", features = ["serde1"] }
tempfile = "3"
fs4 = "0.13"

# Perfis: NUNCA impor lto=fat/codegen-units=1 como optimização universal (ADR-0007).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
