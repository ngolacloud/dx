name: Release

# Compila o executável `dx` para vários alvos e anexa os binários (+ .sha256)
# à Release da tag. Desenhado para o instalador site/install.sh baixar binários
# pré-compilados — sem exigir cargo/Rust na máquina de destino.
#
# Gatilho normal: empurrar uma tag v* (ex.: v0.0.2).
# Gatilho de ensaio: workflow_dispatch com `tag` (ex.: v0.0.2-rc1) para testar o
# pipeline sem queimar a tag de produção — publicar binários é irreversível.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a compilar/publicar (ex.: v0.0.2 ou v0.0.2-rc1 de ensaio)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: build on ubuntu-22.04 (glibc 2.35) for a broad compatibility
          # floor — the resulting binaries run on any glibc >= 2.35 distro. A
          # static musl build is not viable: dx-sandbox uses the glibc-only
          # libc::__rlimit_resource_t, which does not exist under musl.
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: dx-linux-x86_64
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: dx-linux-aarch64
          - name: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            asset: dx-macos-x86_64
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            asset: dx-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build dx (release)
        run: cargo build -p ngoladx-cli --release --locked --target ${{ matrix.target }}

      - name: Package binary + sha256
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/dx" "dist/${{ matrix.asset }}"
          cd dist
          # Formato: "<hash>  <nome-do-ficheiro>" — compatível com `sha256sum -c`
          # no Linux e `shasum -a 256 -c` no macOS. O install.sh compara o campo
          # do hash, pelo que o nome aqui não precisa de coincidir com o destino.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          echo "---"; cat "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lR dist

      - name: Create/ensure release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published assets for $TAG:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name'
