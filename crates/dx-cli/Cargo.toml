[package]
name = "ngoladx-cli"
# O binário versiona independentemente das libs (0.0.1): esta release só altera
# o `ngoladx-cli` (autocomplete dinâmico de shell), não as bibliotecas `dx_*`.
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DX — experiência de ferramentas Rust inspirada no UV. Executável: `dx`."

# NOME PUBLICADO vs EXECUTÁVEL (ADR-0003): o crate `dx` já existe em crates.io
# (yanked). O package publica-se como `dx-cli`; o binário chama-se `dx`.
[[bin]]
name = "dx"
path = "src/main.rs"

[dependencies]
dx-core.workspace = true
dx-manifest.workspace = true
dx-security.workspace = true
dx-integrity.workspace = true
dx-sandbox.workspace = true
dx-build.workspace = true
dx-release.workspace = true
dx-report.workspace = true
dx-seiva.workspace = true
dx-bench.workspace = true
dx-env.workspace = true
dx-tool.workspace = true
toml = "0.8"
anyhow.workspace = true
camino.workspace = true
serde_json.workspace = true
sha2.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
tempfile.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true
sha2 = "0.10"
